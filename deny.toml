# cargo-deny configuration.
#
# The licence check is the one that matters commercially. Chipbreaker is
# GPL-3.0-or-later plus a commercial licence, which means every dependency must
# be usable under *both*. Permissive licences (MIT, Apache-2.0, BSD, Unicode) are
# fine. A copyleft dependency would be compatible with our GPL side and fatal to
# the commercial side, so it must be flagged, not waived.

[graph]
all-features = true

[licenses]
version = 2
# Permissive only. Deliberately no GPL, LGPL, MPL, AGPL, or "no licence stated":
# each of those either forecloses the commercial licence or leaves us unable to
# prove we may ship the code at all.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.93

# blake3 is triple-licensed; CC0-1.0 and Apache-2.0 are both in `allow`, so no
# clarification is needed. Add entries here only with a note explaining why the
# chosen licence is the one we are relying on.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Determinism, not size, is why these are banned.
deny = [
    # Parallelism arrives in U11 behind a deterministic partitioning scheme.
    # Until then a work-stealing scheduler in the dependency graph is a
    # non-determinism risk that no test would reliably catch.
    { name = "rayon", reason = "no parallelism before U11; see CONTRIBUTING.md" },
    { name = "rayon-core", reason = "no parallelism before U11; see CONTRIBUTING.md" },
    # These make determinism guarantees we do not control, and glam is f32-first
    # with target-dependent SIMD paths. We own our linear algebra.
    { name = "nalgebra", reason = "we own our f64 linear algebra; see math module docs" },
    { name = "glam", reason = "f32-first with target-dependent SIMD; breaks bit-exactness" },
]

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
