# cargo-deny configuration.
#
# ============================================================================
# The licence policy is a COMMERCIAL constraint, not a hygiene preference.
# ============================================================================
#
# Chipbreaker is dual-licensed: GPL-3.0-or-later plus a commercial licence. The
# commercial side is what pays for the work, and it only exists if we hold clean
# title to everything we ship.
#
# A single copyleft dependency anywhere in the tree destroys that. Not "makes it
# awkward" — destroys it. If a GPL, LGPL, AGPL, MPL, EPL or CDDL crate is linked
# into the product, we cannot grant a customer a proprietary-use licence without
# that author's separate permission, and there is no technical fix after the
# fact: the dependency has to be ripped out and replaced.
#
# Note that a copyleft dependency would be perfectly *legal* under our GPL side.
# That is exactly why this needs its own gate — the usual "is it GPL-compatible?"
# question gives the wrong answer here. The question we must ask is "may we ship
# this in a proprietary product?", and only permissive licences answer yes.
#
# **Do not relax this to make a build pass.** If a dependency you want is
# copyleft, the options are: find a permissive alternative, vendor a permissive
# reimplementation, or do without. Raise it rather than editing this file.
# ============================================================================

[graph]
all-features = true

[licenses]
version = 2

# Permissive only. With `version = 2` this list is exhaustive: anything absent is
# denied, so GPL, LGPL, AGPL, MPL, EPL, CDDL, SSPL, BUSL and every other copyleft
# or source-available licence is rejected by construction rather than by an
# explicit blocklist that could fall out of date as new licences appear.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    # Required, not merely permitted. `unicode-ident` is
    # "(MIT OR Apache-2.0) AND Unicode-3.0" — the AND means the Unicode licence
    # applies on top of the permissive one and cannot be satisfied by choosing an
    # alternative. Unicode-3.0 (the Unicode License v3) is permissive: it grants
    # unrestricted use, modification and distribution of the data files and
    # software, with attribution and no reciprocal obligation. It is safe for the
    # commercial licence.
    #
    # `unicode-ident` reaches us only through proc-macro dependencies (syn,
    # serde_derive), which are build-time and never linked into the shipped
    # artifact — so this is doubly safe.
    "Unicode-3.0",
]

# The list describes what we are willing to accept, not what we happen to depend
# on today; without this, the report churns every time a dependency changes.
unused-allowed-license = "allow"
confidence-threshold = 0.93

# The allow list above governs *dependencies*. Chipbreaker's own crates are
# GPL-3.0-or-later, deliberately absent from it: adding GPL there would also
# permit a GPL dependency, which is precisely the thing this file exists to stop.
# The first-party crates are named exceptions instead.
#
# Add an entry here only with a note explaining why the licence is acceptable for
# BOTH sides of the dual licence.
[[licenses.exceptions]]
name = "chipbreaker-core"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
name = "chipbreaker"
allow = ["GPL-3.0-or-later"]

# The G-code parser. First-party, so the same reasoning applies as for the other
# two: GPL-3.0-or-later for the open distribution, and the commercial licence
# covers it because copyright title is held in one place. It links only
# chipbreaker-core, which carries the same terms.
[[licenses.exceptions]]
name = "chipbreaker-gcode"
allow = ["GPL-3.0-or-later"]

# The browser build. First-party, same reasoning again: it is the engine
# compiled for `wasm32-unknown-unknown` and links nothing the other three do
# not.
[[licenses.exceptions]]
name = "chipbreaker-wasm"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Determinism, not size, is why these are banned.
deny = [
    # Parallelism belongs behind a deterministic partitioning scheme.
    # Until then a work-stealing scheduler in the dependency graph is a
    # non-determinism risk that no test would reliably catch.
    { name = "rayon", reason = "parallelism only behind a deterministic partition; see CONTRIBUTING.md" },
    { name = "rayon-core", reason = "parallelism only behind a deterministic partition; see CONTRIBUTING.md" },
    # These make determinism guarantees we do not control, and glam is f32-first
    # with target-dependent SIMD paths. We own our linear algebra.
    { name = "nalgebra", reason = "we own our f64 linear algebra; see math module docs" },
    { name = "glam", reason = "f32-first with target-dependent SIMD; breaks bit-exactness" },
]

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
