[workspace]
resolver = "3"
members = [
    "crates/chipbreaker-core",
    "crates/chipbreaker-gcode",
    "crates/chipbreaker",
    "crates/chipbreaker-wasm",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.96.0"
license = "GPL-3.0-or-later"
authors = ["Langtfelt"]
repository = "https://github.com/langtfelt-engineering/chipbreaker"
homepage = "https://github.com/langtfelt-engineering/chipbreaker"

[workspace.dependencies]
chipbreaker-core = { path = "crates/chipbreaker-core", version = "0.1.1" }
chipbreaker-gcode = { path = "crates/chipbreaker-gcode", version = "0.1.1" }

# --- Determinism-critical dependencies ---------------------------------------
# These are pinned with `=` because their output feeds a canonical hash that is
# a published product guarantee. A patch release that changes a random stream or
# a digest would silently invalidate every golden file. Bumping any of these is
# a deliberate act: see CONTRIBUTING.md, "Changing a pinned dependency".
robust = "=1.1.0"
blake3 = { version = "=1.8.2", default-features = false, features = ["std"] }
rand = { version = "=0.9.3", default-features = false, features = [
    "std",
    "std_rng",
] }

# --- Non-determinism-critical dependencies -----------------------------------
clap = { version = "4", features = ["derive"] }

# `float_roundtrip` is NOT optional, and serde_json is only in this section
# because its *output* is already exact. Its default float **parser** is not:
# it reads 2.0481555856608242 as 2.048155585660824, one ULP low, where Rust's
# own str::parse is correctly rounded. A tool library that loses a bit on read
# describes a different solid from the one that was written, and a saved
# simulation would stop reproducing. The feature makes parsing bit-exact.
serde_json = { version = "1", features = ["float_roundtrip"] }

# --- Dev/bench ---------------------------------------------------------------
proptest = "1"
# The exact predicate oracle uses BigInt only, not BigRational: every predicate
# is a homogeneous polynomial, so rescaling a case by a power of two makes all
# its coordinates exact integers and the determinant computable with no GCD and
# no rounding. See tests/exact_predicates.rs.
num-bigint = "0.4"
num-traits = "0.2"
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Determinism guards. `mul_add` compiles to a hardware FMA where one exists and
# to a software emulation where one does not; the two round differently, so a
# single call is enough to break native/WASM parity.
suboptimal_flops = "allow"          # its suggested fix is mul_add
imprecise_flops = "allow"           # ditto
# The banned list lives in clippy.toml: every `std` transcendental, plus
# `mul_add`. Denied rather than warned, because a single slip breaks the
# product guarantee rather than merely looking untidy.
disallowed_methods = "deny"
# Correctness and hygiene.
todo = "warn"
unwrap_used = "warn"
must_use_candidate = "allow"
missing_panics_doc = "warn"
missing_errors_doc = "warn"

[profile.release]
# A single codegen unit removes cross-unit inlining variability, which is one of
# the ways the same source can produce differently-rounded float sequences.
lto = "fat"
codegen-units = 1
panic = "abort"
# Overflow checks stay on in release: a silent wrap in an index computation is a
# far worse outcome than the cycles it costs us.
overflow-checks = true

[profile.bench]
lto = "fat"
codegen-units = 1
