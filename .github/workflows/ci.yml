name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the long-running fuzz that is too slow for every commit.
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always
  # A golden mismatch must fail the build. Accepting one is a local, deliberate
  # act that produces a reviewable diff — never something CI does for you.
  CHIPBREAKER_ACCEPT_GOLDEN: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # All three on every push, with wasm32-wasip1 alongside them in its own job.
    #
    # The guarantee this project sells is that the answer is identical on every
    # target, so a commit that has only been checked on one has not been checked.
    # `fail-fast: false` because when they do disagree, knowing *which* pair
    # disagrees is most of the diagnosis.
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # No toolchain version here on purpose: rust-toolchain.toml is the single
      # source of truth for the pin, its components and its extra targets.
      # `rustup show` materialises exactly what that file asks for.
      - name: Install the pinned toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # --all-targets covers tests, benches and examples; the plain form skips
      # them. --all-features means a feature-gated module cannot escape review by
      # being off by default.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all

      # Compiled, not timed. CI runners are shared and noisy; a timing gate here
      # would produce more false alarms than findings. Real numbers are recorded
      # by hand in BENCHMARKS.md.
      - name: Benchmarks compile
        run: cargo bench --no-run

      - name: Self-test
        run: |
          cargo run --release -p chipbreaker -- \
            selftest --report json --out "selftest-${{ matrix.os }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.os }}
          path: selftest-${{ matrix.os }}.json

  cross-platform-parity:
    name: cross-platform parity
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports

      # The three operating systems must agree with each other, not merely each
      # with itself. Windows, Linux and macOS use different libm, different
      # allocators and different default codegen; if any of that reaches a float,
      # this is where it shows.
      - name: Compare all three results hashes
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          seen = {}
          for path in sorted(pathlib.Path("reports").rglob("*.json")):
              results = json.load(path.open())["results"]
              seen[path.name] = results
              print(f"{path.name}: {results['hash']}")
          if not seen:
              sys.exit("no self-test reports were produced")
          first_name, first = next(iter(seen.items()))
          bad = False
          for name, results in seen.items():
              if results != first:
                  print(f"::error::{name} disagrees with {first_name}")
                  for a, b in zip(first["suites"], results["suites"]):
                      if a["hash"] != b["hash"]:
                          print(f"  suite {a['name']}: {a['hash']} vs {b['hash']}")
                  bad = True
          if bad:
              sys.exit(1)
          print(f"{len(seen)} platforms agree: {first['hash']}")
          if len(seen) < 3:
              print(
                  f"::error::Only {len(seen)} platform(s) reported, so this is NOT "
                  "a cross-platform parity check. Every push runs all three."
              )
              sys.exit(1)
          # Per-suite digests, per platform, printed ALWAYS. The overall hash
          # covers every suite digest via SuiteResult::hash_canonical, so
          # agreement on it implies agreement on each -- but that is an argument
          # about an encoding, and a table of numbers read off each machine is
          # not. The report quotes these directly.
          print()
          header = f"  {'suite':<24}" + "".join(f" {n.replace('selftest-', '').replace('.json', ''):<20}" for n in seen)
          print(header)
          for index in range(len(first["suites"])):
              row = f"  {first['suites'][index]['name']:<24}"
              for results in seen.values():
                  row += f" {results['suites'][index]['hash'][:18]:<20}"
              print(row)
          PY

  determinism-rules:
    name: determinism rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The rules from CONTRIBUTING.md that no linter expresses. Each grep skips
      # comment lines, so the rules can be *discussed* in documentation without
      # tripping the check that enforces them.
      - name: No f32, FMA, unordered maps or parallelism in the core
        run: |
          fail=0
          check() {
            local pattern="$1" message="$2"
            local hits
            # Comment lines are skipped, so the rules can be discussed in
            # documentation without tripping the check that enforces them.
            # `ALLOW-f32-WIRE-FORMAT` marks the handful of lines that must name
            # f32 because a file format stores it; see CONTRIBUTING.md rule 1.
            hits=$(grep -rn --include='*.rs' -E "$pattern" crates/ \
                   | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|/\*)' \
                   | grep -v 'ALLOW-f32-WIRE-FORMAT' || true)
            if [ -n "$hits" ]; then
              echo "::error::$message"
              echo "$hits"
              fail=1
            fi
          }
          check '\bf32\b' \
            'f32 found. The core is f64 only; CONTRIBUTING.md rule 1. A wire
             format that genuinely stores f32 (binary STL) may name the type on a
             line carrying the marker comment, which makes each exception
             reviewable rather than widening the rule.'
          check '\bmul_add\b' \
            'mul_add found. Native and WASM contract multiply-add differently; CONTRIBUTING.md rule 2.'
          check '\bHash(Map|Set)\b' \
            'HashMap/HashSet found. Use BTreeMap/BTreeSet where iteration order can reach a float; CONTRIBUTING.md rule 3.'
          check '\brayon\b|thread::spawn' \
            'Parallelism found. It belongs behind a deterministic partition; CONTRIBUTING.md rule 4.'
          exit $fail

      - name: No internal development references in a public tree
        run: |
          # The repository is public and its history is not organised around
          # anything a reader can see. A reference to internal sequencing is
          # meaningless to them and, worse, dates the file it sits in.
          #
          # This exists because prose drifted where nothing was looking: a
          # generator's rationale text was updated and its committed output was
          # not, and a second reference survived in a hand-maintained corpus that
          # no regeneration job covers. Both were prose, so no assertion about
          # geometry could ever have caught them. A grep can.
          #
          # Every tracked file, with no exclusions -- the earlier sweep missed
          # both cases precisely because it excluded the generated JSON.
          hits=$(git ls-files -z | xargs -0 grep -nE '\bUnits? [0-9]+\b|\bU[0-9]+\b' \
                 -- . ':(exclude).github/workflows/ci.yml' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::internal development references found in a public tree"
            echo "$hits"
            exit 1
          fi

      - name: serde_json is only ever taken from the workspace
        run: |
          # The workspace entry carries `float_roundtrip`, without which
          # serde_json reads 2.0481555856608242 as 2.048155585660824 -- one ULP
          # low. A crate that declares serde_json directly would silently opt
          # out of the fix. `float_roundtrip_guard.rs` catches the feature being
          # removed; this catches it being bypassed.
          bad=$(grep -rn '^serde_json *=' crates/*/Cargo.toml                 | grep -v 'workspace *= *true' || true)
          if [ -n "$bad" ]; then
            echo "::error::a crate declares serde_json without inheriting the workspace entry"
            echo "$bad"
            exit 1
          fi
          if ! grep -q 'float_roundtrip' Cargo.toml; then
            echo "::error::the workspace serde_json entry has lost float_roundtrip; CONTRIBUTING.md explains why it is not optional"
            exit 1
          fi

      - name: Every crate forbids unsafe
        run: |
          fail=0
          # Globbed rather than listed: a hard-coded list silently stops
          # covering a crate the moment somebody adds one, which is exactly
          # when the check matters most.
          roots=$(ls crates/*/src/lib.rs crates/*/src/main.rs 2>/dev/null)
          if [ -z "$roots" ]; then
            echo "::error::no crate roots found"
            exit 1
          fi
          for lib in $roots; do
            if grep -q '#!\[forbid(unsafe_code)\]' "$lib"; then
              continue
            fi
            # An ABI boundary is the one place the rule cannot hold: handing a
            # raw pointer across a language edge *is* unsafe, and a crate that
            # claimed otherwise would be lying rather than safe. Such a crate
            # marks itself and must still deny implicit unsafe inside unsafe
            # functions, so every unsafe operation is written out.
            #
            # Same shape as ALLOW-f32-WIRE-FORMAT: an exception that has to name
            # itself is reviewable; a widened rule is not.
            if grep -q 'ALLOW-UNSAFE-ABI-BOUNDARY' "$lib"; then
              if ! grep -q '#!\[deny(unsafe_op_in_unsafe_fn)\]' "$lib"; then
                echo "::error file=$lib::an ABI-boundary crate must still deny unsafe_op_in_unsafe_fn"
                fail=1
              fi
              continue
            fi
            echo "::error file=$lib::missing #![forbid(unsafe_code)]; CONTRIBUTING.md rule 7."
            fail=1
          done
          exit $fail

      - name: Every .rs file has an SPDX header
        run: |
          fail=0
          while IFS= read -r f; do
            if ! head -n 1 "$f" | grep -q 'SPDX-License-Identifier: GPL-3.0-or-later'; then
              echo "::error file=$f::missing SPDX header on the first line"
              fail=1
            fi
          done < <(find crates -name '*.rs' -not -path '*/target/*')
          exit $fail

      - name: Golden files are LF-terminated lower-case hex
        run: |
          fail=0
          shopt -s nullglob
          files=(tests/golden/*.hash)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no golden files found"
            exit 1
          fi
          for f in "${files[@]}"; do
            if [ "$(wc -c < "$f")" -ne 65 ]; then
              echo "::error file=$f::expected 64 hex digits plus one LF"
              fail=1
            fi
            if grep -q $'\r' "$f"; then
              echo "::error file=$f::contains CR; .gitattributes should have prevented this"
              fail=1
            fi
            if ! head -c 64 "$f" | grep -qE '^[0-9a-f]{64}$'; then
              echo "::error file=$f::not 64 lower-case hex digits"
              fail=1
            fi
          done
          exit $fail

  corpus-regeneration:
    name: corpus regenerates identically
    runs-on: ubuntu-latest
    # A generated corpus file that nobody can regenerate is a corpus file that
    # has been hand-edited, and a generator whose output has drifted from the
    # committed data is a test asserting something nobody chose. This catches
    # both, and it catches the empty-file accident that produced it: the corpus
    # expectations were once truncated to zero bytes by a redirect that ran
    # before its generator failed, and committed that way.
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Regenerate every generated corpus file
        run: |
          cargo run -q -p chipbreaker-core --example generate_tool_corpus             > tests/corpus/tool/standard-library.json
          python3 scripts/tool_corpus_expectations.py             > tests/corpus/tool/expectations.json
          python3 scripts/gcode_corpus.py
          cargo run -q -p chipbreaker-core --example generate_dexel_corpus             > tests/corpus/dexel/expectations.json
          cargo run -q -p chipbreaker-core --example generate_tri_corpus             > tests/corpus/tridexel/expectations.json
          cargo run -q -p chipbreaker-core --example generate_sweep_corpus             > tests/corpus/sweep/expectations.json
          cargo run -q -p chipbreaker-core --example generate_contour_corpus             > tests/corpus/contour/expectations.json
          cargo run -q -p chipbreaker-core --example generate_defect_corpus             > tests/corpus/defect/expectations.json

      - name: Nothing may have changed, and nothing may be empty
        run: |
          for f in tests/corpus/tool/standard-library.json                    tests/corpus/tool/expectations.json                    tests/corpus/gcode/expectations.json                    tests/corpus/dexel/expectations.json                    tests/corpus/tridexel/expectations.json                    tests/corpus/sweep/expectations.json                    tests/corpus/contour/expectations.json                    tests/corpus/defect/expectations.json; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::regenerated to an empty file"
              exit 1
            fi
          done
          git diff --exit-code -- tests/corpus/ || {
            echo "::error::a committed corpus file differs from what its generator produces"
            exit 1
          }

  licences:
    name: dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: taiki-e/install-action@cargo-deny
      # A copyleft dependency would be compatible with our GPL side and fatal to
      # the commercial one. This is a licensing gate, not hygiene.
      - run: cargo deny check licenses
      - run: cargo deny check bans sources

  wasm-parity:
    name: wasm parity
    runs-on: ubuntu-latest
    # This job is the point of the whole workflow. Everything else checks that
    # the code is correct; this checks that it is *identical* on a 32-bit target
    # with a different libm and a different codegen backend, which is the
    # guarantee we sell.
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml already lists wasm32-wasip1 as a target.
      - name: Install the pinned toolchain
        run: |
          rustup show
          rustup target list --installed

      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Build native and WASM
        run: |
          cargo build --release -p chipbreaker
          cargo build --release --target wasm32-wasip1 -p chipbreaker
          cargo build --release --target wasm32-unknown-unknown -p chipbreaker-wasm

      - name: Run both self-tests
        run: |
          ./target/release/chipbreaker selftest --report json --out native.json
          wasmtime ./target/wasm32-wasip1/release/chipbreaker.wasm \
            selftest --report json > wasm.json

      # The whole `results` section is compared, not only its hash. A collision
      # is not the worry; a hash that has quietly stopped covering something is.
      - name: Compare native against WASM
        run: |
          python3 - <<'PY'
          import json, sys
          native = json.load(open("native.json"))["results"]
          wasm = json.load(open("wasm.json"))["results"]
          print(f"native: {native['hash']}")
          print(f"wasm:   {wasm['hash']}")
          # Per-suite digests printed ALWAYS, not only on failure. Four numbers
          # read off four machines beats one number plus an argument about what
          # SuiteResult::hash_canonical covers, and the report quotes these.
          print()
          print(f"  {'suite':<24} {'native':<20} {'wasm':<20} ")
          for a, b in zip(native["suites"], wasm["suites"]):
              flag = "same" if a["hash"] == b["hash"] else "DIFF"
              print(f"  {a['name']:<24} {a['hash'][:16]}...  {b['hash'][:16]}...  {flag}")
          print()
          if native == wasm:
              print(f"Identical: {len(native['suites'])} suites, {native['total_cases']} cases.")
              sys.exit(0)
          print("::error::WASM parity broken: the same input produced different output on wasm32-wasip1.")
          sys.exit(1)
          PY

      # The *browser* target, in a browser engine. `wasm32-unknown-unknown` is
      # not `wasm32-wasip1`: no WASI, a different allocator path, and V8 rather
      # than wasmtime. The demo makes a parity claim on the page, and a claim a
      # visitor could disprove by opening the console is worse than no claim, so
      # it is gated here rather than checked by hand.
      #
      # The harness is deliberately crude -- four calls returning integers, no
      # memory marshalling -- so agreement cannot be an artifact of it.
      - name: The browser build agrees with the published digest
        run: |
          DIGEST=$(python3 -c "import json;print(json.load(open('native.json'))['results']['hash'])")
          echo "published: $DIGEST"
          CHIPBREAKER_EXPECTED_DIGEST="$DIGEST"             node scripts/wasm_parity.mjs             target/wasm32-unknown-unknown/release/chipbreaker_wasm.wasm

  integration-surface:
    name: integration surface
    runs-on: ubuntu-latest
    # The C ABI, its header, the reference host, the Python bindings and the
    # evaluation corpus. Everything an integrator touches in their first
    # afternoon, built and run the way the quick-start says to build and run it.
    #
    # A documented example that does not compile is worse than no example: it
    # costs an evaluator an hour before they conclude the fault is theirs.
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Build the C ABI
        run: cargo build --release -p chipbreaker-abi

      # The header is generated, committed, and must match. Drift here compiles
      # cleanly and then disagrees about layout at run time, which is the worst
      # class of bug this project can ship.
      - name: The committed header matches the Rust source
        run: |
          cargo install cbindgen --locked --version 0.29.0 || true
          cbindgen --config crates/chipbreaker-abi/cbindgen.toml \
                   --crate chipbreaker-abi --output /tmp/generated.h
          if ! diff -u include/chipbreaker.h /tmp/generated.h; then
            echo
            echo "include/chipbreaker.h is out of date. Regenerate it with:"
            echo "  cbindgen --config crates/chipbreaker-abi/cbindgen.toml \\"
            echo "           --crate chipbreaker-abi --output include/chipbreaker.h"
            exit 1
          fi

      - name: The reference host compiles
        run: |
          cmake -S examples/c -B target/example-c -DCHIPBREAKER_ROOT=.
          cmake --build target/example-c

      # Run it, not merely build it. A host that compiles and then segfaults on
      # its first job has taught the evaluator something worse than nothing.
      - name: The reference host runs, and a refusal is a success
        run: |
          set -e
          ./target/example-c/host \
              tests/corpus/eval/faced.nc \
              tests/corpus/tool/standard-library.json \
              tests/corpus/eval/stock.stl \
              tests/corpus/eval/nominal-faced.stl

          # G41 is refused, and the host must exit 0 for it: a refusal is an
          # answer. If this ever exits non-zero the example is teaching the
          # opposite of the design.
          ./target/example-c/host \
              tests/corpus/eval/g41.nc \
              tests/corpus/tool/standard-library.json \
              tests/corpus/eval/stock.stl | tee /tmp/refusal.txt
          grep -q "REFUSED" /tmp/refusal.txt
          grep -q "G40" /tmp/refusal.txt

      - name: The evaluation corpus matches its own expectations
        run: cargo test --release -p chipbreaker-abi

      - name: Documentation examples compile and run
        run: cargo test --doc --workspace

      - name: The Python bindings build from source and keep the sentence
        run: |
          python3 -m pip install --upgrade pip maturin
          cd crates/chipbreaker-python
          maturin build --release --out ../../target/wheels
          cd ../..
          python3 -m pip install --force-reinstall --no-deps target/wheels/chipbreaker-*.whl
          python3 - <<'PY'
          import chipbreaker
          d = "tests/corpus/eval/"
          T = "tests/corpus/tool/standard-library.json"

          # The digest must be the same number the native build publishes. A
          # binding that computes different answers is not a binding.
          print("digest", chipbreaker.selftest_digest())
          assert chipbreaker.selftest_passed()

          r = chipbreaker.verify(program=d + "faced-gouge.nc", tools=T,
                                 stock=d + "stock.stl", nominal=d + "nominal-faced.stl",
                                 resolution_mm=0.5)
          assert r["schema"] == "chipbreaker.verification-report", r["schema"]
          assert r["verdict"]["gates"]["gouge"]["state"] == "fail"
          assert abs(r["summary"]["worst_gouge_mm"] - 1.0) < 0.02
          # Attribution, which is the half of a finding a machinist acts on.
          assert r["findings"][0]["attribution"]["segments"], "no NC line named"

          # The sentence has to survive into the exception, unmodified.
          try:
              chipbreaker.verify(program=d + "siemens.mpf", tools=T, stock=d + "stock.stl")
              raise SystemExit("a Siemens program must be refused")
          except chipbreaker.Refused as e:
              assert "Siemens" in str(e), e
              assert "DEF REAL" in str(e), e
          print("python bindings ok")
          PY

  nightly-fuzz:
    name: nightly fuzz
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # A million span operations against deliberately hostile input. Too slow
      # for every commit, too valuable to drop.
      - run: cargo test --release --all -- --ignored --nocapture
