# Determinism enforcement that the type system cannot express.
#
# `std`'s transcendental functions lower to the platform libm — MSVC's, glibc's
# and wasi-libc's are different code and genuinely differ in the last bit. Every
# one of them is banned by path here, and `chipbreaker_core::transcendental`
# provides a `libm`-backed replacement that is the same Rust source on every
# target. See that module's documentation for why this matters and for the
# evidence that the replacement really is bit-identical.
#
# `f64::sqrt` is deliberately absent from this list: IEEE-754 requires it to be
# correctly rounded, so every target already agrees on it.
#
# `f64::mul_add` is banned for a different reason — it fuses a multiply and an
# add into a single rounding, and the hardware FMA native targets use is not the
# path WASM takes. CI also greps for it; see CONTRIBUTING.md rule 2.

disallowed-methods = [
    { path = "f64::sin", reason = "use chipbreaker_core::transcendental::sin; std lowers to the platform libm" },
    { path = "f64::cos", reason = "use chipbreaker_core::transcendental::cos; std lowers to the platform libm" },
    { path = "f64::tan", reason = "use chipbreaker_core::transcendental::tan; std lowers to the platform libm" },
    { path = "f64::sin_cos", reason = "use chipbreaker_core::transcendental::sin_cos; std lowers to the platform libm" },
    { path = "f64::asin", reason = "use chipbreaker_core::transcendental::asin; std lowers to the platform libm" },
    { path = "f64::acos", reason = "use chipbreaker_core::transcendental::acos; std lowers to the platform libm" },
    { path = "f64::atan", reason = "use chipbreaker_core::transcendental::atan; std lowers to the platform libm" },
    { path = "f64::atan2", reason = "use chipbreaker_core::transcendental::atan2; std lowers to the platform libm" },
    { path = "f64::exp", reason = "use chipbreaker_core::transcendental::exp; std lowers to the platform libm" },
    { path = "f64::exp2", reason = "no reproducible replacement yet; add one to transcendental if needed" },
    { path = "f64::exp_m1", reason = "no reproducible replacement yet; add one to transcendental if needed" },
    { path = "f64::ln", reason = "use chipbreaker_core::transcendental::ln; std lowers to the platform libm" },
    { path = "f64::ln_1p", reason = "no reproducible replacement yet; add one to transcendental if needed" },
    { path = "f64::log", reason = "use chipbreaker_core::transcendental::ln or log10" },
    { path = "f64::log2", reason = "no reproducible replacement yet; add one to transcendental if needed" },
    { path = "f64::log10", reason = "use chipbreaker_core::transcendental::log10; std lowers to the platform libm" },
    { path = "f64::powf", reason = "use chipbreaker_core::transcendental::powf; std lowers to the platform libm" },
    { path = "f64::hypot", reason = "use chipbreaker_core::transcendental::hypot; std lowers to the platform libm" },
    { path = "f64::cbrt", reason = "use chipbreaker_core::transcendental::cbrt; std lowers to the platform libm" },
    { path = "f64::sinh", reason = "no reproducible replacement yet; add one to transcendental if needed" },
    { path = "f64::cosh", reason = "no reproducible replacement yet; add one to transcendental if needed" },
    { path = "f64::tanh", reason = "no reproducible replacement yet; add one to transcendental if needed" },
    { path = "f64::asinh", reason = "no reproducible replacement yet; add one to transcendental if needed" },
    { path = "f64::acosh", reason = "no reproducible replacement yet; add one to transcendental if needed" },
    { path = "f64::atanh", reason = "no reproducible replacement yet; add one to transcendental if needed" },
    { path = "f64::mul_add", reason = "no FMA: native and WASM contract multiply-add differently; CONTRIBUTING.md rule 2" },
    { path = "f32::sin", reason = "the core is f64 only; CONTRIBUTING.md rule 1" },
    { path = "f32::cos", reason = "the core is f64 only; CONTRIBUTING.md rule 1" },
    { path = "f32::sqrt", reason = "the core is f64 only; CONTRIBUTING.md rule 1" },
    { path = "f32::mul_add", reason = "the core is f64 only, and no FMA; CONTRIBUTING.md rules 1 and 2" },
]
