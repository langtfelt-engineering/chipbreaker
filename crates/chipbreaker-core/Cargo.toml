[package]
name = "chipbreaker-core"
description = "Numeric core for Chipbreaker: exact geometric predicates, interval spans, and the bit-exact determinism harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["cnc", "machining", "geometry", "simulation", "determinism"]
categories = ["science", "simulation", "mathematics"]

[dependencies]
robust.workspace = true
blake3.workspace = true
rand.workspace = true
libm = "=0.2.16"
ryu = "=1.0.23"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.41.0"
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
criterion.workspace = true
num-rational = "0.4"

